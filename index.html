  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore - Home</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#000000;
padding:15px 8%;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:20px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

.hero{
height:85vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url('https://images.unsplash.com/photo-1511707171634-5f897ff02aa9');
background-size:cover;
background-position:center;
color:white;
}

.hero h1{
font-size:50px;
}

.hero p{
margin:20px 0;
font-size:20px;
}

.btn{
background:#fbbf24;
padding:12px 25px;
text-decoration:none;
color:black;
border-radius:25px;
font-weight:bold;
}

footer{
background:#050505;
color:white;
text-align:center;
padding:15px;
}

@media(max-width:768px){
nav{
flex-direction:column;
}

nav ul{
margin-top:10px;
flex-wrap:wrap;
justify-content:center;
}

.hero h1{
font-size:35px;
}
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo">TechStore</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="products.html">Products</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>
</header>

<section class="hero">
<div>
<h1>Latest Technology Products</h1>
<p>Quality Products at Affordable Prices</p>
<a href="products.html" class="btn">View Products</a>
</div>
</section>

<footer>
<p>© 2026 TechStore. All Rights Reserved.</p>
</footer>

</body>
</html>
